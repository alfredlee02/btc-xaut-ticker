<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0f">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="行情">
  <meta name="description" content="BTC 同 XAUT 即時報價">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>BTC · XAUT 行情</title>
  <link rel="stylesheet" href="styles.css?v=22">
</head>
<body>
  <div class="refresh-hint" id="refreshHint" hidden>釋放以更新</div>
  <div class="toast" id="alertToast" hidden role="status" aria-live="assertive"></div>
  <div class="app">
    <header class="top">
      <div>
        <h1>豬髀實時報價</h1>
        <p class="status" id="status" aria-live="polite">載入中…</p>
      </div>
      <button class="icon-btn" id="refreshBtn" type="button" aria-label="重新整理">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4V1L7 6l5 5V7c2.76 0 5 2.24 5 5a5 5 0 0 1-8.16 3.87l-1.46 1.46A7 7 0 0 0 19 12c0-1.93-.78-3.68-2.35-5.65zM6 12a5 5 0 0 1 8.16-3.87l1.46-1.46A7 7 0 0 0 5 12c0 1.93.78 3.68 2.35 5.65A7.95 7.95 0 0 0 12 20v3l5-5-5-5v3a5 5 0 0 1-5-5z"/>
        </svg>
      </button>
    </header>

    <main class="cards">
      <article class="card" id="card-0" data-slot="0" data-symbol="BTCUSDT">
        <svg class="spark" data-spark viewBox="0 0 240 100" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div class="card-body">
          <button class="card-head" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="揀幣種，而家係比特幣">
            <span class="logo-slot" data-logo>
              <img class="logo" src="icons/btc.svg" width="36" height="36" alt="" aria-hidden="true">
            </span>
            <span class="head-text">
              <span class="coin-name" data-name>比特幣</span>
              <span class="ticker" data-ticker>BTC / USDT</span>
            </span>
            <svg class="chevron" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path fill="currentColor" d="M4.2 6.2a.75.75 0 0 1 1.06 0L8 8.94l2.74-2.74a.75.75 0 1 1 1.06 1.06l-3.27 3.27a.75.75 0 0 1-1.06 0L4.2 7.26a.75.75 0 0 1 0-1.06z"/>
            </svg>
          </button>
          <div class="quote">
            <p class="price" data-price>—</p>
            <div class="change" data-change>
              <span data-change-amt>—</span>
              <span class="pill" data-change-pct>—</span>
            </div>
          </div>
          <div class="periods">
            <span class="period" data-chg-1h><em>1h</em> <b>—</b></span>
            <span class="period" data-chg-4h><em>4h</em> <b>—</b></span>
            <span class="period" data-chg-7d><em>7d</em> <b>—</b></span>
          </div>
          <div class="range" hidden>
            <div class="range-labels">
              <span>24h 低 <b data-low>—</b></span>
              <span>高 <b data-high>—</b></span>
            </div>
            <div class="range-track"><i data-range-pos></i></div>
          </div>
          <p class="spike" data-spike hidden></p>
        </div>
      </article>

      <article class="card" id="card-1" data-slot="1" data-symbol="XAUTUSDT">
        <svg class="spark" data-spark viewBox="0 0 240 100" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div class="card-body">
          <button class="card-head" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="揀幣種，而家係黃金">
            <span class="logo-slot" data-logo>
              <img class="logo" src="icons/xaut.svg" width="36" height="36" alt="" aria-hidden="true">
            </span>
            <span class="head-text">
              <span class="coin-name" data-name>黃金</span>
              <span class="ticker" data-ticker>XAUT / USDT</span>
            </span>
            <svg class="chevron" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path fill="currentColor" d="M4.2 6.2a.75.75 0 0 1 1.06 0L8 8.94l2.74-2.74a.75.75 0 1 1 1.06 1.06l-3.27 3.27a.75.75 0 0 1-1.06 0L4.2 7.26a.75.75 0 0 1 0-1.06z"/>
            </svg>
          </button>
          <div class="quote">
            <p class="price" data-price>—</p>
            <div class="change" data-change>
              <span data-change-amt>—</span>
              <span class="pill" data-change-pct>—</span>
            </div>
          </div>
          <div class="periods">
            <span class="period" data-chg-1h><em>1h</em> <b>—</b></span>
            <span class="period" data-chg-4h><em>4h</em> <b>—</b></span>
            <span class="period" data-chg-7d><em>7d</em> <b>—</b></span>
          </div>
          <div class="range" hidden>
            <div class="range-labels">
              <span>24h 低 <b data-low>—</b></span>
              <span>高 <b data-high>—</b></span>
            </div>
            <div class="range-track"><i data-range-pos></i></div>
          </div>
          <p class="spike" data-spike hidden></p>
        </div>
      </article>
    </main>

    <section class="alert-bar" id="alertBar">
      <div class="alert-row">
        <div>
          <h3>成交提示</h3>
          <p class="alert-hint" id="alertHint">1 或 5 分鐘成交額遠高過近 3 小時水平就會出聲。要 app 開住先會响；電話靜音可能唔會响。</p>
        </div>
        <button class="switch" id="alertToggle" type="button" role="switch" aria-checked="false" aria-label="成交提示"></button>
      </div>
      <div class="alert-volume" id="alertVolumeWrap" hidden>
        <label for="alertVolume">音量</label>
        <input id="alertVolume" type="range" min="0" max="100" value="70" step="1">
      </div>
    </section>

    <section class="alert-bar" id="wakeBar">
      <div class="alert-row">
        <div>
          <h3>保持螢幕常亮</h3>
          <p class="alert-hint" id="wakeHint">開咗就盡量唔讓電話自動熄屏，方便放係度睇。</p>
        </div>
        <button class="switch" id="wakeToggle" type="button" role="switch" aria-checked="false" aria-label="保持螢幕常亮"></button>
      </div>
    </section>

    <p class="footnote">價格來自 Binance 公開行情，僅供參考，唔構成任何投資建議。</p>

    <div class="install" id="installBanner" hidden>
      <p>想當 app 用：用 Safari 開，撳分享鈕，再選「加到主畫面」。</p>
      <button type="button" id="dismissInstall">知道</button>
    </div>
  </div>

  <div class="picker" id="picker" hidden>
    <div class="picker-backdrop" data-picker-close></div>
    <div class="picker-sheet" role="dialog" aria-modal="true" aria-labelledby="pickerTitle" tabindex="-1">
      <div class="picker-handle" aria-hidden="true"></div>
      <div class="picker-top">
        <h3 id="pickerTitle">揀幣種</h3>
        <button type="button" class="picker-close" id="pickerClose" data-picker-close aria-label="關閉">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path fill="currentColor" d="M18.3 5.71a1 1 0 0 0-1.41 0L12 10.59 7.11 5.7A1 1 0 0 0 5.7 7.11L10.59 12 5.7 16.89a1 1 0 1 0 1.41 1.41L12 13.41l4.89 4.89a1 1 0 0 0 1.41-1.41L13.41 12l4.89-4.89a1 1 0 0 0 0-1.4z"/>
          </svg>
        </button>
      </div>
      <p class="picker-sub" id="pickerSub">Binance USDT 成交額頭 20，名單會跟成交量更新。</p>
      <div class="picker-list" id="pickerList" role="listbox" aria-labelledby="pickerTitle"></div>
    </div>
  </div>

  <script src="app.js?v=22"></script>
</body>
</html>
